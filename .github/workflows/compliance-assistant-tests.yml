name: Compliance Assistant tests

on:
  push:
    paths:
      - "project/**"
      - ".github/workflows/compliance-assistant-tests.yml"
  pull_request:
    paths:
      - "project/**"
      - ".github/workflows/compliance-assistant-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: project/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run Jest suite
        run: npm test -- --runInBand